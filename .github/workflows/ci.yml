name: CI

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:

jobs:
  test:
    name: Build and test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Use the newest Xcode on the runner
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"

      - name: Swift version
        run: swift --version

      # ZharpCore and Zharp's tests run on macOS; the package supports macOS 12 for exactly this.
      - name: Test on macOS
        run: swift test

      # What apps actually build: the Zharp library for an iOS device and the simulator.
      - name: Build for iOS
        run: |
          xcodebuild build -scheme Zharp -destination 'generic/platform=iOS' -skipPackagePluginValidation CODE_SIGNING_ALLOWED=NO
          xcodebuild build -scheme Zharp -destination 'generic/platform=iOS Simulator' -skipPackagePluginValidation CODE_SIGNING_ALLOWED=NO
